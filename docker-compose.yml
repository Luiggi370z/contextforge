services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: contextforge
      POSTGRES_DB: contextforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d contextforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://contextforge:contextforge@postgres:5432/contextforge
      QDRANT_URL: http://qdrant:6333
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sample_corpus:/sample_corpus:ro

volumes:
  postgres_data:
  qdrant_data:
