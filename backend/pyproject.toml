[project]
name = "contextforge"
version = "0.1.0"
description = "Agentic RAG platform with LangGraph, FastAPI, and hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "qdrant-client>=1.12",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "rank-bm25>=0.2",  # eval harness sparse leg only (prod uses FastEmbed-in-Qdrant)
    "numpy>=1.26",
    "pydantic-ai>=0.2",
    "instructor>=1.0",
    "openai>=1.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "arq>=0.26",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "fastembed>=0.4",
]
obs = [
    "langfuse>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
    "sentence-transformers>=3.0",
    "ragas>=0.2",
    "datasets>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# The golden-set eval downloads a sentence-transformers model (~90 MB) so it is
# opt-in. ``just test-eval`` and CI run it explicitly with ``pytest -m eval``.
addopts = "-m 'not eval'"
markers = [
    "eval: end-to-end retrieval + abstain evaluation over the golden set",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"app/api/**/*.py" = ["B008"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
